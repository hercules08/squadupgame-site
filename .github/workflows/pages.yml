name: Publish Squad Up site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only current public files
        run: |
          mkdir -p public/css public/images public/privacy public/support public/terms
          cp src/index.html src/404.html src/robots.txt src/sitemap.xml src/app-ads.txt src/.nojekyll public/
          cp src/css/site.css public/css/
          cp src/images/squadup.jpg src/images/googleplay-btn.png src/images/app-store-black-on-color@2x-vUVAkYHUgzYCyeyfUGm8cda3C.png public/images/
          cp src/privacy/index.html public/privacy/
          cp src/support/index.html public/support/
          cp src/terms/index.html public/terms/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
